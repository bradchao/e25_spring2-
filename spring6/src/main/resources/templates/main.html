<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Main Page V2</h1>
    <h2 th:text="${companyName}">CompanyName</h2>
    <hr />
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
    <hr />
    <div>
        <label>Account: </label>
        <span sec:authentication="name" >Account</span> /
        <span sec:authentication="principal.authorities">Role</span>
    </div>
</body>
</html>
