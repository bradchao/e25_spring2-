<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
    </head>
    <body>
        <h1>Home Page</h1>
        <hr />
        <h2>Hello, <span th:text="${member.name}"></span></h2>
        <div><img th:src="${icon}" /></div>
        <div><a th:href="@{/members/logout}">Logout</a></div>
        <hr />
        <div>
            <span>Prev</span>
            <span>Page / Total</span>
            <span>Next</span>
        </div>
        <hr />
        <table>
            <thead>
                <th>ID</th>
                <th>Name</th>
                <th>Tel</th>
                <th>Address</th>
            </thead>
            <tbody>
                <tr th:each="hotel : ${hotels.content}">
                    <td th:text="${hotel.id}"></td>
                    <td th:text="${hotel.name}"></td>
                    <td th:text="${hotel.tel}"></td>
                    <td th:text="${hotel.addr}"></td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
