<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h3>Page3</h3>
    <hr />
    <form method="post" th:object="${memberForm}" th:action="@{/page3}">
        <div>
            <label>Account</label>
            <input type="text" required="required" th:field="*{account}"/>
            <span th:if="${#fields.hasErrors('account')}"
                  th:errors="*{account}">Account 錯誤訊息</span>
        </div>
        <div>
            <label>Password</label>
            <input type="password" required="required" th:field="*{passwd}"/>
            <span th:if="${#fields.hasErrors('passwd')}"
                  th:errors="*{passwd}">Password 錯誤訊息</span>
        </div>
        <div>
            <label>Name</label>
            <input type="text" required="required" th:field="*{name}" />
            <span th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}">Name 錯誤訊息</span>
        </div>
        <button type="submit">Register</button>
    </form>
</body>
</html>
