<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <h1>Page1</h1>
  <hr />
  <h2 th:text="${companyName}">公司名稱</h2>
  <div th:text="'Welcome1, ' + ${userName}">Welcome, User</div>
  <div th:text="${'Welcome2, ' + userName }">Welcome, User</div>
  <div th:text="${now}">現在Server時間</div>

</html>
