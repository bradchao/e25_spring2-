<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Title</title>
  </head>
  <body>
    <h3>Login Page</h3>
    <hr />
    <form method="post" th:action="@{/members/login}">
      <div>
        <label>Account</label>
        <input type="text" name="account" required="required"/>
      </div>
      <div>
        <label>Password</label>
        <input type="password" name="passwd" required="required"/>
      </div>
      <button type="submit">Login</button>
    </form>
    </body>
</html>
